name: Publier la page d'attente

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@v6
      - name: Valider et assembler
        shell: bash
        run: |
          python3 -c 'import json; from pathlib import Path; [json.loads(p.read_text(encoding="utf-8")) for p in Path("data").glob("*.json")]'
          mkdir -p _site/data
          cp -R site/. _site/
          cp -R data/. _site/data/
          touch _site/.nojekyll
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
